<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --border: #3a3a3c;
    --accent: #fc3c44;
    --accent2: #ff6b6b;
    --text: #ffffff;
    --muted: #8e8e93;
    --playing: #fc3c44;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 40px 48px 120px;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(252,60,68,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(252,60,68,0.04) 0%, transparent 50%);
  }

  /* ── Header ── */
  header {
    max-width: 1400px;
    margin: 0 auto 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .header-left h1 em { color: var(--accent); font-style: italic; }

  .header-left .subtitle {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .header-right {
    text-align: right;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .header-right .username { color: var(--accent); font-size: 0.75rem; }

  /* ── Period Selector ── */
  .period-bar {
    max-width: 1400px;
    margin: 0 auto 40px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .period-label {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-right: 8px;
  }

  .period-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .period-btn:hover { border-color: var(--accent); color: var(--accent); }
  .period-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .period-btn.loading {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    opacity: 0.7;
    pointer-events: none;
    position: relative;
    overflow: hidden;
  }
  .period-btn.loading::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    animation: shimmer 1s infinite;
  }

  /* ── Section label ── */
  .section-label {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    max-width: 1400px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── Top Stats (3 cards) ── */
  .top-stats {
    max-width: 1400px;
    margin: 0 auto 48px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    gap: 16px;
    align-items: center;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s ease;
    cursor: pointer;
    opacity: 0;
    animation: fadeUp 0.4s ease forwards;
  }

  .stat-card:hover { background: var(--surface2); border-color: var(--accent); transform: translateY(-2px); }
  .stat-card:nth-child(1) { animation-delay: 0.05s; }
  .stat-card:nth-child(2) { animation-delay: 0.15s; }
  .stat-card:nth-child(3) { animation-delay: 0.25s; }

  .stat-art { width: 64px; height: 64px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: var(--surface2); }
  .stat-art-placeholder { width: 64px; height: 64px; border-radius: 4px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0; }
  .stat-info { overflow: hidden; flex: 1; }
  .stat-type { font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .stat-name { font-family: 'Playfair Display', serif; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-sub { font-size: 0.65rem; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-plays { font-size: 0.62rem; color: var(--accent); margin-top: 6px; }

  /* ── Activity Chart ── */
  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    min-width: 0;
  }

  .chart-title {
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 120px;
  }

  .chart-bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
    justify-content: flex-end;
  }

  .chart-bar {
    width: 100%;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
    opacity: 0.7;
    transition: opacity 0.2s, height 0.6s ease;
    min-height: 2px;
    cursor: default;
    position: relative;
  }

  .chart-bar:hover { opacity: 1; }

  .chart-bar-label {
    font-size: 0.5rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-align: center;
    white-space: nowrap;
  }

  .chart-tooltip {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 0.6rem;
    color: var(--text);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }

  .chart-bar:hover .chart-tooltip { opacity: 1; }

  /* ── Two-column layout for Top 10 + Recent ── */
  .two-col {
    max-width: 1400px;
    margin: 0 auto 48px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: start;
  }

  /* ── Top 10 Lists ── */
  .top-list { display: flex; flex-direction: column; gap: 2px; }

  .top-list-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
  }

  .tab-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .top-item {
    display: grid;
    grid-template-columns: 28px 40px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--surface);
    border-radius: 4px;
    border: 1px solid transparent;
    transition: all 0.2s;
    opacity: 0;
    animation: fadeUp 0.3s ease forwards;
    cursor: pointer;
  }

  .top-item:hover { background: var(--surface2); border-color: var(--border); }
  .top-item:hover .top-item-name { color: var(--accent); }

  .top-rank { font-size: 0.65rem; color: var(--border); text-align: center; }
  .top-rank.gold   { color: #f5c842; }
  .top-rank.silver { color: #a0a0a0; }
  .top-rank.bronze { color: #cd7f32; }

  .top-art { width: 40px; height: 40px; border-radius: 3px; object-fit: cover; background: var(--surface2); }
  .top-art-placeholder { width: 40px; height: 40px; border-radius: 3px; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--border); font-size: 1rem; }

  .top-item-info { overflow: hidden; }
  .top-item-name { font-family: 'Playfair Display', serif; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.2s; }
  .top-item-sub  { font-size: 0.62rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .top-item-plays { font-size: 0.62rem; color: var(--muted); white-space: nowrap; }

  /* ── Recent Tracks ── */
  .track-list { display: flex; flex-direction: column; gap: 2px; }

  .track {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 4px;
    transition: all 0.2s ease;
    opacity: 0;
    transform: translateY(6px);
    animation: fadeUp 0.4s ease forwards;
    cursor: pointer;
  }

  .track:hover { background: var(--surface2); border-color: var(--border); }
  .track:hover .track-name { color: var(--accent); }
  .track.now-playing { border-color: rgba(252,60,68,0.3); background: rgba(252,60,68,0.06); }
  .track.previewing  { border-color: rgba(252,60,68,0.4) !important; background: rgba(252,60,68,0.1) !important; }

  .track-art { width: 48px; height: 48px; border-radius: 3px; object-fit: cover; flex-shrink: 0; background: var(--surface2); }
  .track-art-placeholder { width: 48px; height: 48px; border-radius: 3px; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--border); font-size: 1.2rem; flex-shrink: 0; }
  .track-info { overflow: hidden; }
  .track-name { font-family: 'Playfair Display', serif; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.2s; }
  .track-artist { font-size: 0.65rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-album  { font-size: 0.58rem; color: var(--border); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-meta { text-align: right; flex-shrink: 0; }
  .track-time { font-size: 0.62rem; color: var(--muted); }
  .track-number { font-size: 0.6rem; color: var(--border); }

  .now-playing-badge { display: flex; align-items: center; gap: 5px; font-size: 0.58rem; color: var(--playing); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 3px; justify-content: flex-end; }
  .pulse-dot { width: 5px; height: 5px; background: var(--playing); border-radius: 50%; animation: pulse 1.5s ease-in-out infinite; }

  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.4; transform:scale(0.7); } }
  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }

  /* stagger */
  .track:nth-child(1)  { animation-delay:.03s } .track:nth-child(2)  { animation-delay:.06s }
  .track:nth-child(3)  { animation-delay:.09s } .track:nth-child(4)  { animation-delay:.12s }
  .track:nth-child(5)  { animation-delay:.15s } .track:nth-child(6)  { animation-delay:.18s }
  .track:nth-child(7)  { animation-delay:.21s } .track:nth-child(8)  { animation-delay:.24s }
  .track:nth-child(9)  { animation-delay:.27s } .track:nth-child(10) { animation-delay:.30s }
  .track:nth-child(11) { animation-delay:.33s } .track:nth-child(12) { animation-delay:.36s }
  .track:nth-child(13) { animation-delay:.39s } .track:nth-child(14) { animation-delay:.42s }
  .track:nth-child(15) { animation-delay:.45s } .track:nth-child(16) { animation-delay:.48s }
  .track:nth-child(17) { animation-delay:.51s } .track:nth-child(18) { animation-delay:.54s }
  .track:nth-child(19) { animation-delay:.57s } .track:nth-child(20) { animation-delay:.60s }

  .top-item:nth-child(1)  { animation-delay:.03s } .top-item:nth-child(2)  { animation-delay:.06s }
  .top-item:nth-child(3)  { animation-delay:.09s } .top-item:nth-child(4)  { animation-delay:.12s }
  .top-item:nth-child(5)  { animation-delay:.15s } .top-item:nth-child(6)  { animation-delay:.18s }
  .top-item:nth-child(7)  { animation-delay:.21s } .top-item:nth-child(8)  { animation-delay:.24s }
  .top-item:nth-child(9)  { animation-delay:.27s } .top-item:nth-child(10) { animation-delay:.30s }

  /* ── Skeletons ── */
  .skeleton { background: var(--surface); position: relative; overflow: hidden; border-radius: 4px; }
  .skeleton::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.03),transparent); animation:shimmer 1.5s infinite; }
  @keyframes shimmer { from{transform:translateX(-100%)} to{transform:translateX(100%)} }

  /* ── Footer ── */
  footer {
    max-width: 1400px;
    margin: 48px auto 0;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .refresh-btn { background:none; border:1px solid var(--border); color:var(--muted); font-family:'DM Mono',monospace; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; padding:6px 14px; border-radius:2px; cursor:pointer; transition:all 0.2s; }
  .refresh-btn:hover { border-color:var(--accent); color:var(--accent); }
  .total-scrobbles { color:var(--accent); font-family:'Playfair Display',serif; font-size:1.1rem; }

  /* ── Preview Player ── */
  #preview-player {
    position: fixed;
    bottom: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: min(560px, calc(100vw - 48px));
    background: #1c1c1e;
    border: 1px solid #3a3a3c;
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 999;
    transition: bottom 0.4s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }

  #preview-player.visible { bottom: 24px; }
  #preview-art { width:44px; height:44px; border-radius:4px; object-fit:cover; flex-shrink:0; background:var(--surface2); }
  #preview-info { flex:1; overflow:hidden; }
  #preview-title { font-family:'Playfair Display',serif; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #preview-artist { font-size:0.65rem; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #preview-status { font-size:0.6rem; color:var(--accent); margin-top:3px; letter-spacing:0.08em; text-transform:uppercase; }
  .player-controls { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  #play-pause-btn { width:36px; height:36px; border-radius:50%; background:var(--accent); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:0.9rem; transition:transform 0.15s,background 0.2s; }
  #play-pause-btn:hover { transform:scale(1.08); background:var(--accent2); }
  #close-player-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:1rem; padding:4px; transition:color 0.2s; }
  #close-player-btn:hover { color:var(--text); }
  #progress-bar-wrap { position:absolute; bottom:0; left:0; right:0; height:3px; background:var(--border); border-radius:0 0 16px 16px; overflow:hidden; }
  #progress-bar { height:100%; width:0%; background:var(--accent); transition:width 0.5s linear; }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    body { padding: 24px 16px 120px; }
    header { margin-bottom: 28px; }
    .header-left h1 { font-size: 1.8rem; }
    .top-stats { grid-template-columns: 1fr; }
    .two-col { grid-template-columns: 1fr; gap: 40px; }
    .chart-grid { grid-template-columns: 1fr !important; }
    .chart-bars { height: 60px; }
    .period-bar { gap: 4px; }
    .period-btn { font-size: 0.58rem; padding: 4px 10px; }
    .stat-card { padding: 14px; }
    .stat-art, .stat-art-placeholder { width: 52px; height: 52px; }
  }

  @media (max-width: 480px) {
    .top-stats { grid-template-columns: 1fr; }
    .stat-name { font-size: 0.9rem; }
    #preview-player { padding: 10px 14px; gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>My <em>Music</em></h1>
    <div class="subtitle">Apple Music · via Last.fm</div>
  </div>
  <div class="header-right">
    <div class="username">awmenges1990</div>
    <div id="last-updated" style="margin-top:4px;">—</div>
  </div>
</header>

<!-- Period Selector -->
<div class="period-bar">
  <span class="period-label">Period:</span>
  <button class="period-btn active" data-period="7day">7 Days</button>
  <button class="period-btn" data-period="1month">1 Month</button>
  <button class="period-btn" data-period="6month">6 Months</button>
  <button class="period-btn" data-period="12month">12 Months</button>
  <button class="period-btn" data-period="overall">All Time</button>
</div>

<!-- Top Stats -->
<div class="section-label">Top This Period</div>
<div id="stats-container" style="max-width:1400px;margin:0 auto 48px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
  <div class="skeleton" style="height:104px;border-radius:8px;border:1px solid var(--border)"></div>
  <div class="skeleton" style="height:104px;border-radius:8px;border:1px solid var(--border)"></div>
  <div class="skeleton" style="height:104px;border-radius:8px;border:1px solid var(--border)"></div>
</div>

<!-- Activity Charts -->
<div class="section-label">Listening Activity</div>
<div class="chart-grid" style="max-width:1400px;margin:0 auto 48px;display:grid;grid-template-columns:1fr 1fr;gap:16px;">
  <div class="chart-wrap">
    <div class="chart-title">Past 7 Days</div>
    <div id="chart-bars" class="chart-bars"></div>
  </div>
  <div class="chart-wrap">
    <div class="chart-title">Past 12 Months</div>
    <div id="chart-monthly" class="chart-bars"></div>
  </div>
</div>

<!-- Top 10 + Recent Tracks side by side -->
<div class="two-col">

  <!-- Left: Top 10 -->
  <div>
    <div class="section-label" style="margin-bottom:12px;">Top 10</div>
    <div class="top-list-tabs">
      <button class="tab-btn" data-tab="tracks">Tracks</button>
      <button class="tab-btn active" data-tab="artists">Artists</button>
      <button class="tab-btn" data-tab="albums">Albums</button>
    </div>
    <div id="top-list" class="top-list">
      ${Array(10).fill('<div class="skeleton" style="height:62px;margin-bottom:2px;"></div>').join('')}
    </div>
  </div>

  <!-- Right: Recent Tracks -->
  <div>
    <div class="section-label" style="margin-bottom:12px;">Recent Tracks</div>
    <div id="track-container" class="track-list">
      ${Array(12).fill('<div class="skeleton" style="height:70px;margin-bottom:2px;"></div>').join('')}
    </div>
  </div>

</div>

<footer>
  <div id="scrobble-count">Loading...</div>
  <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
</footer>

<!-- Floating Preview Player -->
<div id="preview-player">
  <img id="preview-art" src="" alt="">
  <div id="preview-info">
    <div id="preview-title">—</div>
    <div id="preview-artist">—</div>
    <div id="preview-status">—</div>
  </div>
  <div class="player-controls">
    <button id="play-pause-btn" onclick="togglePlayPause()">⏸</button>
    <button id="close-player-btn" onclick="closePlayer()">✕</button>
  </div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
</div>

<script>
  const API_KEY  = '92a8f3a946bef62c6597480d8243dd62';
  const USERNAME = 'awmenges1990';
  const BASE     = 'https://ws.audioscrobbler.com/2.0/';

  let currentPeriod  = '7day';
  let currentTopTab  = 'artists';
  let currentAudio   = null;
  let currentTrackEl = null;
  let topTracksCache = {};
  let topArtistsCache = {};
  let topAlbumsCache  = {};

  // ── Helpers ──────────────────────────────────────────────
  function lfm(params) {
    const url = BASE + '?' + new URLSearchParams({ ...params, user: USERNAME, api_key: API_KEY, format: 'json' });
    return fetch(url).then(r => r.json());
  }

  function timeAgo(ts) {
    const d = Math.floor(Date.now()/1000) - ts;
    if (d < 60) return 'just now';
    if (d < 3600) return Math.floor(d/60)+'m ago';
    if (d < 86400) return Math.floor(d/3600)+'h ago';
    if (d < 604800) return Math.floor(d/86400)+'d ago';
    return new Date(ts*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }

  function getImage(images) {
    if (!images?.length) return null;
    for (const s of ['extralarge','large','medium','small']) {
      const img = images.find(i => i.size === s);
      if (img?.['#text']) return img['#text'];
    }
    return null;
  }

  function appleMusicUrl(name, artist='') {
    return `https://music.apple.com/search?term=${encodeURIComponent(artist ? `${artist} ${name}` : name)}`;
  }

  function rankClass(i) {
    if (i===0) return 'gold'; if (i===1) return 'silver'; if (i===2) return 'bronze'; return '';
  }

  // ── Period buttons ────────────────────────────────────────
  document.querySelectorAll('.period-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active', 'loading'));
      btn.classList.add('active', 'loading');
      currentPeriod = btn.dataset.period;

      // Instantly show skeletons so user knows something is happening
      document.getElementById('stats-container').innerHTML = `
        <div class="skeleton" style="height:104px;border-radius:8px;border:1px solid var(--border)"></div>
        <div class="skeleton" style="height:104px;border-radius:8px;border:1px solid var(--border)"></div>
        <div class="skeleton" style="height:104px;border-radius:8px;border:1px solid var(--border)"></div>`;
      document.getElementById('top-list').innerHTML =
        Array(10).fill('<div class="skeleton" style="height:62px;margin-bottom:2px;"></div>').join('');

      Promise.all([loadStats(), loadTopList()]).finally(() => {
        btn.classList.remove('loading');
      });
    });
  });

  // ── Top tab buttons ───────────────────────────────────────
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTopTab = btn.dataset.tab;
      renderTopList();
    });
  });

  // ── Activity Chart ────────────────────────────────────────
  function renderBars(containerId, buckets) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const max = Math.max(...buckets.map(b => b.count), 1);
    el.innerHTML = buckets.map(b => {
      const pct = Math.max((b.count / max) * 100, b.count > 0 ? 4 : 2);
      return `
        <div class="chart-bar-col">
          <div class="chart-bar" style="height:${pct}%">
            <div class="chart-tooltip">${b.count} plays</div>
          </div>
          <div class="chart-bar-label">${b.label}</div>
        </div>`;
    }).join('');
  }

  async function loadChart() {
    const barsEl = document.getElementById('chart-bars');
    const monthEl = document.getElementById('chart-monthly');
    try {
      // Weekly chart: fetch recent 200 tracks and bucket by day
      const data = await lfm({ method: 'user.getrecenttracks', limit: 200 });
      const tracks = data?.recenttracks?.track || [];

      const now = Date.now();
      const days = Array.from({length: 7}, (_, i) => {
        const d = new Date(now - (6-i) * 86400000);
        return { label: d.toLocaleDateString('en-US', {weekday:'short'}), date: d.toDateString(), count: 0 };
      });
      tracks.forEach(t => {
        if (!t.date) return;
        const d = new Date(parseInt(t.date.uts) * 1000).toDateString();
        const day = days.find(day => day.date === d);
        if (day) day.count++;
      });
      renderBars('chart-bars', days);

    } catch(e) {
      if (barsEl) barsEl.innerHTML = '<div style="color:var(--muted);font-size:0.7rem;margin:auto;">Chart unavailable</div>';
    }

    // Monthly chart: use Last.fm weekly charts to get 12 months of data
    try {
      const monthlyData = await lfm({ method: 'user.getweeklychartlist' });
      const charts = monthlyData?.weeklychartlist?.chart || [];

      // Group weekly charts into months
      const monthMap = {};
      charts.forEach(c => {
        const d = new Date(parseInt(c.from) * 1000);
        const key = d.toLocaleDateString('en-US', {month:'short', year:'2-digit'});
        if (!monthMap[key]) monthMap[key] = { label: d.toLocaleDateString('en-US', {month:'short'}), count: 0, ts: parseInt(c.from) };
      });

      // Fetch play counts for most recent 12 months using user.getmonthlyplaycount workaround
      // Use weekly chart data count from recent tracks instead — approximate via recenttracks pages
      // Better: use user.getrecenttracks with from/to for each of last 12 months
      const now2 = Math.floor(Date.now() / 1000);
      const months = Array.from({length: 12}, (_, i) => {
        const d = new Date();
        d.setDate(1);
        d.setMonth(d.getMonth() - (11 - i));
        return {
          label: d.toLocaleDateString('en-US', {month:'short'}),
          from: Math.floor(d.getTime() / 1000),
          to: i === 11 ? now2 : Math.floor(new Date(d.getFullYear(), d.getMonth()+1, 1).getTime() / 1000),
          count: 0
        };
      });

      // Fetch all 12 months in parallel (just page 1 to get totalPages/total attr)
      const results = await Promise.all(
        months.map(m => lfm({ method:'user.getrecenttracks', limit:1, from:m.from, to:m.to }))
      );

      results.forEach((res, i) => {
        const total = parseInt(res?.recenttracks?.['@attr']?.total || 0);
        months[i].count = total;
      });

      renderBars('chart-monthly', months);

    } catch(e) {
      if (monthEl) monthEl.innerHTML = '<div style="color:var(--muted);font-size:0.7rem;margin:auto;">Chart unavailable</div>';
    }
  }

  // ── Top Stats (track/artist/album #1) ────────────────────
  async function loadStats() {
    const el = document.getElementById('stats-container');
    // Only reset to skeletons if not already showing them (period button click pre-populates)
    if (!el.querySelector('.skeleton')) {
      el.innerHTML = `
        <div class="skeleton" style="height:104px;border-radius:8px;border:1px solid var(--border)"></div>
        <div class="skeleton" style="height:104px;border-radius:8px;border:1px solid var(--border)"></div>
        <div class="skeleton" style="height:104px;border-radius:8px;border:1px solid var(--border)"></div>`;
    }

    try {
      const [trackRes, artistRes, albumRes] = await Promise.all([
        lfm({ method:'user.gettoptracks', period:currentPeriod, limit:1 }),
        lfm({ method:'user.gettopartists', period:currentPeriod, limit:1 }),
        lfm({ method:'user.gettopalbums',  period:currentPeriod, limit:1 }),
      ]);

      const topTrack  = trackRes?.toptracks?.track?.[0];
      const topArtist = artistRes?.topartists?.artist?.[0];
      const topAlbum  = albumRes?.topalbums?.album?.[0];

      const [trackInfoRes, artistInfoRes] = await Promise.all([
        topTrack  ? lfm({ method:'track.getInfo',  track:topTrack.name,  artist:topTrack.artist?.name }) : null,
        topArtist ? lfm({ method:'artist.getInfo', artist:topArtist.name }) : null,
      ]);

      const trackImg  = getImage(trackInfoRes?.track?.album?.image) || getImage(topTrack?.image);
      const artistImg = getImage(artistInfoRes?.artist?.image) || getImage(topArtist?.image);

      const cards = [
        { label:'🎵 Top Track',  name:topTrack?.name,  sub:topTrack?.artist?.name, plays:topTrack?.playcount,  img:trackImg,              url:appleMusicUrl(topTrack?.name||'', topTrack?.artist?.name) },
        { label:'🎤 Top Artist', name:topArtist?.name, sub:'',                     plays:topArtist?.playcount, img:artistImg,             url:appleMusicUrl(topArtist?.name||'') },
        { label:'💿 Top Album',  name:topAlbum?.name,  sub:topAlbum?.artist?.name, plays:topAlbum?.playcount,  img:getImage(topAlbum?.image), url:appleMusicUrl(topAlbum?.name||'', topAlbum?.artist?.name) },
      ];

      const periodLabel = document.querySelector(`.period-btn.active`)?.textContent || '';

      el.style.cssText = 'max-width:1400px;margin:0 auto 48px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;';
      el.innerHTML = '';
      cards.forEach(card => {
        const isTrack = card.label.includes('Track');
        const div = document.createElement('div');
        div.className = 'stat-card';
        div.style.cursor = 'pointer';
        div.innerHTML = `
          ${card.img ? `<img class="stat-art" src="${card.img}" alt="">` : `<div class="stat-art-placeholder">${card.label.split(' ')[0]}</div>`}
          <div class="stat-info">
            <div class="stat-type">${card.label}${isTrack ? ' <span style="color:var(--muted);font-size:0.5rem;">· CLICK TO PREVIEW</span>' : ''}</div>
            <div class="stat-name">${card.name||'—'}</div>
            ${card.sub ? `<div class="stat-sub">${card.sub}</div>` : ''}
            ${card.plays ? `<div class="stat-plays">${parseInt(card.plays).toLocaleString()} plays · ${periodLabel}</div>` : ''}
          </div>`;
        if (isTrack && card.name) {
          div.addEventListener('click', () => {
            if (currentTrackEl) currentTrackEl.classList.remove('previewing');
            currentTrackEl = div;
            div.classList.add('previewing');
            playPreview(card.name, card.sub||'', card.img||'');
          });
          div.title = 'Click to preview';
        } else {
          div.addEventListener('click', () => window.open(card.url, '_blank'));
          div.title = 'Open in Apple Music';
        }
        el.appendChild(div);
      });
    } catch(e) {
      el.innerHTML = `<div style="grid-column:1/-1;padding:24px;text-align:center;color:var(--muted);font-size:0.75rem;">Couldn't load stats</div>`;
    }
  }

  // ── Top 10 List ───────────────────────────────────────────
  async function loadTopList() {
    const [trackRes, artistRes, albumRes] = await Promise.all([
      lfm({ method:'user.gettoptracks', period:currentPeriod, limit:10 }),
      lfm({ method:'user.gettopartists', period:currentPeriod, limit:10 }),
      lfm({ method:'user.gettopalbums',  period:currentPeriod, limit:10 }),
    ]);
    topTracksCache[currentPeriod]  = trackRes?.toptracks?.track  || [];
    topArtistsCache[currentPeriod] = artistRes?.topartists?.artist || [];
    topAlbumsCache[currentPeriod]  = albumRes?.topalbums?.album   || [];
    renderTopList();
  }

  async function renderTopList() {
    const el = document.getElementById('top-list');
    let items = [];
    if (currentTopTab === 'tracks')  items = topTracksCache[currentPeriod]  || [];
    if (currentTopTab === 'artists') items = topArtistsCache[currentPeriod] || [];
    if (currentTopTab === 'albums')  items = topAlbumsCache[currentPeriod]  || [];

    if (!items.length) {
      el.innerHTML = Array(10).fill('<div class="skeleton" style="height:62px;margin-bottom:2px;"></div>').join('');
      return;
    }

    // For artists: fetch real artist images via artist.getInfo
    // For tracks: fetch album art via track.getInfo
    // For albums: images usually come through fine already
    let enrichedImages = items.map(item => getImage(item.image));

    if (currentTopTab === 'artists') {
      const infoResults = await Promise.all(
        items.map(item => lfm({ method: 'artist.getInfo', artist: item.name }).catch(() => null))
      );
      enrichedImages = infoResults.map((res, i) =>
        getImage(res?.artist?.image) || getImage(items[i].image)
      );
    } else if (currentTopTab === 'tracks') {
      const infoResults = await Promise.all(
        items.map(item => lfm({ method: 'track.getInfo', track: item.name, artist: item.artist?.name }).catch(() => null))
      );
      enrichedImages = infoResults.map((res, i) =>
        getImage(res?.track?.album?.image) || getImage(items[i].image)
      );
    }

    el.innerHTML = '';
    items.forEach((item, i) => {
      const name       = item.name;
      const sub        = item.artist?.name || '';
      const plays      = item.playcount;
      const img        = enrichedImages[i];
      const url        = appleMusicUrl(name, sub);
      const trackName  = currentTopTab === 'tracks' ? name : '';
      const artistName = currentTopTab === 'tracks' ? sub : name;

      const div = document.createElement('div');
      div.className = 'top-item';
      div.innerHTML = `
        <div class="top-rank ${rankClass(i)}">${i+1}</div>
        ${img ? `<img class="top-art" src="${img}" alt="">` : `<div class="top-art-placeholder">♪</div>`}
        <div class="top-item-info">
          <div class="top-item-name">${name}</div>
          ${sub ? `<div class="top-item-sub">${sub}</div>` : ''}
        </div>
        <div class="top-item-plays">${parseInt(plays).toLocaleString()}</div>`;

      if (currentTopTab === 'tracks') {
        div.addEventListener('click', () => {
          if (currentTrackEl) currentTrackEl.classList.remove('previewing');
          currentTrackEl = div;
          div.classList.add('previewing');
          playPreview(trackName, artistName, img||'');
        });
        div.title = 'Click to preview';
      } else {
        div.addEventListener('click', () => window.open(url, '_blank'));
        div.title = 'Open in Apple Music';
      }

      el.appendChild(div);
    });
  }

  // ── Recent Tracks ─────────────────────────────────────────
  async function loadTracks() {
    const el = document.getElementById('track-container');
    el.innerHTML = Array(12).fill('<div class="skeleton" style="height:70px;margin-bottom:2px;"></div>').join('');

    try {
      const [tracksData, userData] = await Promise.all([
        lfm({ method:'user.getrecenttracks', limit:20 }),
        lfm({ method:'user.getinfo' }),
      ]);

      if (tracksData.error) throw new Error(tracksData.message);

      const tracks = tracksData.recenttracks.track;

      if (userData.user) {
        const count = parseInt(userData.user.playcount).toLocaleString();
        document.getElementById('scrobble-count').innerHTML = `<span class="total-scrobbles">${count}</span> total scrobbles`;
      }

      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

      el.innerHTML = '';
      tracks.forEach((track, index) => {
        const isNow    = track['@attr']?.nowplaying === 'true';
        const imageUrl = getImage(track.image);
        const timeTxt  = isNow ? '' : (track.date ? timeAgo(parseInt(track.date.uts)) : '');
        const num      = isNow ? '' : (index+1);

        const div = document.createElement('div');
        div.className = 'track' + (isNow ? ' now-playing' : '');
        div.title = 'Click to preview';
        div.addEventListener('click', () => {
          if (currentTrackEl) currentTrackEl.classList.remove('previewing');
          currentTrackEl = div;
          div.classList.add('previewing');
          playPreview(track.name, track.artist['#text'], imageUrl||'');
        });
        div.innerHTML = `
          ${imageUrl ? `<img class="track-art" src="${imageUrl}" alt="" loading="lazy">` : `<div class="track-art-placeholder">♪</div>`}
          <div class="track-info">
            <div class="track-name">${track.name}</div>
            <div class="track-artist">${track.artist['#text']}</div>
            ${track.album['#text'] ? `<div class="track-album">${track.album['#text']}</div>` : ''}
          </div>
          <div class="track-meta">
            ${isNow ? `<div class="now-playing-badge"><span class="pulse-dot"></span> Now Playing</div>` : `<div class="track-number">${String(num).padStart(2,'0')}</div>`}
            <div class="track-time">${timeTxt}</div>
          </div>`;
        el.appendChild(div);
      });
    } catch(e) {
      el.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:0.75rem;">Couldn't load tracks: ${e.message}</div>`;
      document.getElementById('scrobble-count').textContent = '—';
    }
  }

  // ── iTunes Preview Player ─────────────────────────────────
  async function getiTunesPreview(trackName, artistName) {
    try {
      const q = encodeURIComponent(`${trackName} ${artistName}`);
      const res = await fetch(`https://itunes.apple.com/search?term=${q}&entity=song&limit=10&media=music`);
      const data = await res.json();
      const match = data.results?.find(r => r.previewUrl);
      if (!match) return null;
      return {
        previewUrl: match.previewUrl,
        artUrl: match.artworkUrl100?.replace('100x100','300x300') || '',
        trackName: match.trackName,
        artistName: match.artistName,
      };
    } catch(e) { return null; }
  }

  async function playPreview(trackName, artistName, artUrl) {
    const player   = document.getElementById('preview-player');
    const statusEl = document.getElementById('preview-status');
    const titleEl  = document.getElementById('preview-title');
    const artistEl = document.getElementById('preview-artist');
    const artEl    = document.getElementById('preview-art');
    const ppBtn    = document.getElementById('play-pause-btn');
    const progress = document.getElementById('progress-bar');

    titleEl.textContent  = trackName;
    artistEl.textContent = artistName;
    artEl.src = artUrl;
    statusEl.textContent = 'Searching…';
    ppBtn.textContent = '⏸';
    progress.style.width = '0%';
    player.classList.add('visible');

    if (currentAudio) { currentAudio.pause(); currentAudio = null; }

    try {
      const result = await getiTunesPreview(trackName, artistName);
      if (!result) { statusEl.textContent = 'No preview available'; return; }

      if (result.artUrl) artEl.src = result.artUrl;
      currentAudio = new Audio(result.previewUrl);
      currentAudio.volume = 0.8;
      statusEl.textContent = '30s preview · Apple Music';

      currentAudio.addEventListener('timeupdate', () => {
        progress.style.width = (currentAudio.currentTime / currentAudio.duration * 100) + '%';
      });
      currentAudio.addEventListener('ended', () => {
        ppBtn.textContent = '▶';
        progress.style.width = '100%';
        statusEl.textContent = 'Preview ended';
        if (currentTrackEl) currentTrackEl.classList.remove('previewing');
      });
      currentAudio.play();
    } catch(e) { statusEl.textContent = 'Preview unavailable'; }
  }

  function togglePlayPause() {
    if (!currentAudio) return;
    const btn = document.getElementById('play-pause-btn');
    if (currentAudio.paused) { currentAudio.play(); btn.textContent = '⏸'; }
    else { currentAudio.pause(); btn.textContent = '▶'; }
  }

  function closePlayer() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if (currentTrackEl) { currentTrackEl.classList.remove('previewing'); currentTrackEl = null; }
    document.getElementById('preview-player').classList.remove('visible');
    document.getElementById('progress-bar').style.width = '0%';
  }

  // ── Boot ──────────────────────────────────────────────────
  function loadAll() {
    loadStats();
    loadTopList();
    loadTracks();
    loadChart();
  }

  loadAll();
  setInterval(loadAll, 60000);
</script>
</body>
