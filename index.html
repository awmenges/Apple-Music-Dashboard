<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --border: #3a3a3c;
    --accent: #fc3c44;
    --accent2: #ff6b6b;
    --text: #ffffff;
    --muted: #8e8e93;
    --playing: #fc3c44;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 40px 24px;
    background-image: 
      radial-gradient(ellipse at 20% 0%, rgba(252, 60, 68, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(252, 60, 68, 0.04) 0%, transparent 50%);
  }

  header {
    max-width: 780px;
    margin: 0 auto 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text);
  }

  .header-left h1 em {
    color: var(--accent);
    font-style: italic;
  }

  .header-left .subtitle {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .header-right {
    text-align: right;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .header-right .username {
    color: var(--accent);
    font-size: 0.75rem;
  }

  .section-label {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    max-width: 780px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .track-list {
    max-width: 780px;
    margin: 0 auto 48px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .track {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 4px;
    transition: all 0.2s ease;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 0.4s ease forwards;
  }

  .track:hover {
    background: var(--surface2);
    border-color: var(--border);
  }

  .track.now-playing {
    border-color: rgba(252, 60, 68, 0.3);
    background: rgba(252, 60, 68, 0.06);
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .track-art {
    width: 48px;
    height: 48px;
    border-radius: 3px;
    background: var(--surface2);
    object-fit: cover;
    flex-shrink: 0;
    position: relative;
  }

  .track-art-placeholder {
    width: 48px;
    height: 48px;
    border-radius: 3px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--border);
    font-size: 1.2rem;
    flex-shrink: 0;
  }

  .track-info {
    overflow: hidden;
  }

  .track-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .track-artist {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-album {
    font-size: 0.62rem;
    color: var(--border);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.03em;
  }

  .track-meta {
    text-align: right;
    flex-shrink: 0;
  }

  .track-time {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .now-playing-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.62rem;
    color
