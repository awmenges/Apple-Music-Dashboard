<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #222222;
    --accent: #c8a96e;
    --accent2: #e8c98e;
    --text: #f0ebe3;
    --muted: #666666;
    --playing: #4ade80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 40px 24px;
    background-image: 
      radial-gradient(ellipse at 20% 0%, rgba(200, 169, 110, 0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(200, 169, 110, 0.04) 0%, transparent 50%);
  }

  header {
    max-width: 780px;
    margin: 0 auto 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text);
  }

  .header-left h1 em {
    color: var(--accent);
    font-style: italic;
  }

  .header-left .subtitle {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .header-right {
    text-align: right;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .header-right .username {
    color: var(--accent);
    font-size: 0.75rem;
  }

  .section-label {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    max-width: 780px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .track-list {
    max-width: 780px;
    margin: 0 auto 48px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .track {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 4px;
    transition: all 0.2s ease;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 0.4s ease forwards;
  }

  .track:hover {
    background: var(--surface2);
    border-color: var(--border);
  }

  .track.now-playing {
    border-color: rgba(74, 222, 128, 0.2);
    background: rgba(74, 222, 128, 0.04);
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .track-art {
    width: 48px;
    height: 48px;
    border-radius: 3px;
    background: var(--surface2);
    object-fit: cover;
    flex-shrink: 0;
    position: relative;
  }

  .track-art-placeholder {
    width: 48px;
    height: 48px;
    border-radius: 3px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--border);
    font-size: 1.2rem;
    flex-shrink: 0;
  }

  .track-info {
    overflow: hidden;
  }

  .track-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .track-artist {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-album {
    font-size: 0.62rem;
    color: var(--border);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.03em;
  }

  .track-meta {
    text-align: right;
    flex-shrink: 0;
  }

  .track-time {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .now-playing-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.62rem;
    color: var(--playing);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
    justify-content: flex-end;
  }

  .pulse-dot {
    width: 6px;
    height: 6px;
    background: var(--playing);
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .track-number {
    font-size: 0.62rem;
    color: var(--border);
    letter-spacing: 0.05em;
  }

  /* Staggered animation delays */
  .track:nth-child(1)  { animation-delay: 0.05s; }
  .track:nth-child(2)  { animation-delay: 0.10s; }
  .track:nth-child(3)  { animation-delay: 0.15s; }
  .track:nth-child(4)  { animation-delay: 0.20s; }
  .track:nth-child(5)  { animation-delay: 0.25s; }
  .track:nth-child(6)  { animation-delay: 0.30s; }
  .track:nth-child(7)  { animation-delay: 0.35s; }
  .track:nth-child(8)  { animation-delay: 0.40s; }
  .track:nth-child(9)  { animation-delay: 0.45s; }
  .track:nth-child(10) { animation-delay: 0.50s; }
  .track:nth-child(11) { animation-delay: 0.55s; }
  .track:nth-child(12) { animation-delay: 0.60s; }
  .track:nth-child(13) { animation-delay: 0.65s; }
  .track:nth-child(14) { animation-delay: 0.70s; }
  .track:nth-child(15) { animation-delay: 0.75s; }
  .track:nth-child(16) { animation-delay: 0.80s; }
  .track:nth-child(17) { animation-delay: 0.85s; }
  .track:nth-child(18) { animation-delay: 0.90s; }
  .track:nth-child(19) { animation-delay: 0.95s; }
  .track:nth-child(20) { animation-delay: 1.00s; }

  .loading {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .skeleton {
    height: 72px;
    background: var(--surface);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
  }

  .skeleton::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%);
    animation: shimmer 1.5s infinite;
  }

  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }

  .error-state {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px;
    text-align: center;
    background: var(--surface);
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .error-state p {
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    line-height: 1.8;
  }

  .error-state .error-icon {
    font-size: 2rem;
    margin-bottom: 16px;
    opacity: 0.4;
  }

  footer {
    max-width: 780px;
    margin: 48px auto 0;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .total-scrobbles {
    color: var(--accent);
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Recently <em>Played</em></h1>
    <div class="subtitle">Apple Music · via Last.fm</div>
  </div>
  <div class="header-right">
    <div class="username">awmenges1990</div>
    <div id="last-updated" style="margin-top:4px;">—</div>
  </div>
</header>

<div class="section-label">Recent Tracks</div>
<div id="track-container" class="loading">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</div>

<footer>
  <div id="scrobble-count">Loading...</div>
  <button class="refresh-btn" onclick="loadTracks()">↻ Refresh</button>
</footer>

<script>
  const API_KEY = '92a8f3a946bef62c6597480d8243dd62';
  const USERNAME = 'awmenges1990';

  function timeAgo(unixTimestamp) {
    const now = Math.floor(Date.now() / 1000);
    const diff = now - unixTimestamp;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    const date = new Date(unixTimestamp * 1000);
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function getImageUrl(images) {
    if (!images || images.length === 0) return null;
    // Prefer large, fall back to medium, then small
    const large = images.find(i => i.size === 'large');
    const medium = images.find(i => i.size === 'medium');
    const small = images.find(i => i.size === 'small');
    const chosen = large || medium || small;
    return chosen && chosen['#text'] ? chosen['#text'] : null;
  }

  async function loadTracks() {
    const container = document.getElementById('track-container');
    container.innerHTML = Array(8).fill('<div class="skeleton"></div>').join('');
    container.className = 'loading';

    try {
      // Fetch recent tracks + user info in parallel
      const [tracksRes, userRes] = await Promise.all([
        fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${USERNAME}&api_key=${API_KEY}&format=json&limit=20`),
        fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getinfo&user=${USERNAME}&api_key=${API_KEY}&format=json`)
      ]);

      const tracksData = await tracksRes.json();
      const userData = await userRes.json();

      if (tracksData.error) {
        throw new Error(tracksData.message || 'API error');
      }

      const tracks = tracksData.recenttracks.track;
      const userInfo = userData.user;

      // Update scrobble count
      if (userInfo) {
        const count = parseInt(userInfo.playcount).toLocaleString();
        document.getElementById('scrobble-count').innerHTML = 
          `<span class="total-scrobbles">${count}</span> total scrobbles`;
      }

      // Update last refreshed time
      document.getElementById('last-updated').textContent = 
        'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

      // Build track list
      container.className = 'track-list';
      container.innerHTML = '';

      tracks.forEach((track, index) => {
        const isNowPlaying = track['@attr'] && track['@attr'].nowplaying === 'true';
        const imageUrl = getImageUrl(track.image);
        const timeDisplay = isNowPlaying ? '' : (track.date ? timeAgo(parseInt(track.date.uts)) : '');
        const trackNumber = isNowPlaying ? '' : (index + 1);

        const div = document.createElement('div');
        div.className = 'track' + (isNowPlaying ? ' now-playing' : '');

        div.innerHTML = `
          ${imageUrl 
            ? `<img class="track-art" src="${imageUrl}" alt="${track.album['#text']}" loading="lazy">`
            : `<div class="track-art-placeholder">♪</div>`
          }
          <div class="track-info">
            <div class="track-name">${track.name}</div>
            <div class="track-artist">${track.artist['#text']}</div>
            ${track.album['#text'] ? `<div class="track-album">${track.album['#text']}</div>` : ''}
          </div>
          <div class="track-meta">
            ${isNowPlaying 
              ? `<div class="now-playing-badge"><span class="pulse-dot"></span> Now Playing</div>`
              : `<div class="track-number">${String(trackNumber).padStart(2,'0')}</div>`
            }
            <div class="track-time">${timeDisplay}</div>
          </div>
        `;

        container.appendChild(div);
      });

    } catch (err) {
      container.className = '';
      container.innerHTML = `
        <div class="error-state">
          <div class="error-icon">⚠</div>
          <p>Couldn't load tracks.<br>
          Check that your Last.fm username is correct and you have scrobbled some songs.<br><br>
          <span style="color: #444; font-size: 0.65rem;">${err.message}</span></p>
        </div>
      `;
      document.getElementById('scrobble-count').textContent = '—';
    }
  }

  // Load on page open
  loadTracks();

  // Auto-refresh every 60 seconds
  setInterval(loadTracks, 60000);
</script>
</body>
</html>
